# Render Blueprint: New > Blueprint > pick this repo. Secrets are generated by Render, not stored in git.
services:
  - type: web
    name: anime-heist-analytics
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heist-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: PLAYER_SALT
        generateValue: true
      - key: RATE_LIMIT_PER_MIN
        value: "600"

databases:
  - name: heist-db
    plan: free
